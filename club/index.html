<div class="wrap"><header class="top"><a href="?" class="brand" aria-label="Inicio Club Granero Fino"><svg viewBox="0 0 48 48" fill="none"><path d="M24 40C2 32 9 8 10 8c20 1 24 17 14 32Z" fill="#7c9461"/><path d="M25 33C22 13 40 8 42 8c4 17-5 27-17 25Z" fill="#173e2c"/><path d="m15 16 12 25" stroke="#faf8f0" stroke-width="1.5"/></svg><div><strong>Granero Fino</strong><small>EL CLUB DE LAS SORPRESAS</small></div></a><nav class="nav" aria-label="Principal"><button data-action="home" id="nav-home">El club</button><button data-action="wallet" id="nav-wallet">Mis premios</button><button data-action="admin" class="desktop-only">Caja ↗</button></nav></header></div>

const API='https://tmzglobhelevkwerjpom.supabase.co/functions/v1/granero-club';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Number(n).toLocaleString('es-CL'),date=s=>new Date(s).toLocaleDateString('es-CL',{day:'numeric',month:'short',year:'numeric'});
const random=()=>Array.from(crypto.getRandomValues(new Uint8Array(32))).map(x=>x.toString(16).padStart(2,'0')).join('');
let wallet=localStorage.getItem('gf-wallet-v1');if(!wallet){wallet=random();localStorage.setItem('gf-wallet-v1',wallet)}
let session=sessionStorage.getItem('gf-admin-v1'),cfg=null,view='home',ticket=null,demo=false,rot=0,dash=null,lookup=null,issued=null,busy=false,filter='available',adminTab='create',memberData=null;
const qs=new URLSearchParams(location.search);let ticketToken=qs.get('giro');let setupKey=new URLSearchParams(location.hash.slice(1)).get('activar');let restored=new URLSearchParams(location.hash.slice(1)).get('club');
if(restored&&/^[a-f0-9]{64}$/.test(restored)){wallet=restored;localStorage.setItem('gf-wallet-v1',wallet);history.replaceState(null,'',location.pathname+'?premios=1');}
if(setupKey)history.replaceState(null,'',location.pathname+'?caja=1');
const base=()=>location.origin+location.pathname;
async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...data})});let v;try{v=await r.json()}catch{throw Error('No pudimos conectar. Intentá de nuevo')};if(!r.ok||v.error)throw Error(v.error||'No pudimos completar la operación');return v;}
function error(e,target='#form-message'){const el=$(target)||$('#message');if(el)el.innerHTML='<div class="error" role="alert">'+esc(e.message||e)+'</div>';else toast(e.message||e)}
function toast(s){$('#live').textContent=s;document.querySelector('.toast')?.remove();let d=document.createElement('div');d.className='toast';d.textContent=s;document.body.append(d);setTimeout(()=>d.remove(),3500)}
function setView(v){view=v;for(let k of ['home','wallet']){document.querySelectorAll('#nav-'+k+',#bottom-'+k).forEach(x=>x.classList.toggle('active',v===k))}render();window.scrollTo({top:0,behavior:'instant'})}
const steps=()=>`<section class="steps" aria-label="Cómo funciona"><div class="step"><span class="num">1</span><div><strong>Comprá en Granero</strong><p>Pedí tu QR en caja.</p></div></div><div class="step"><span class="num">2</span><div><strong>Girá y sorprendete</strong><p>Un giro único por compra válida.</p></div></div><div class="step"><span class="num">3</span><div><strong>Guardá y volvé</strong><p>Usá tu premio en tu próxima compra.</p></div></div></section>`;
function wheel(){let labels=[1,2,1,3,1,2].map(id=>money(cfg?.prizes?.find(p=>p.id===id)?.amount||({1:300,2:500,3:1000}[id])));return `<div class="wheel-shell"><div class="pointer"></div><svg id="wheel" class="wheel" role="img" aria-label="Ruleta de descuentos" viewBox="0 0 400 400"><circle cx="200" cy="200" r="196" fill="#173e2c"/><g>${labels.map((l,i)=>{let a=(-90+i*60)*Math.PI/180,b=a+Math.PI/3,x=200+184*Math.cos(a),y=200+184*Math.sin(a),xx=200+184*Math.cos(b),yy=200+184*Math.sin(b);let fills=['#f1c765','#dbe3ca','#f6e6ba','#527451','#e9e4cd','#b5c39b'];let m=a+Math.PI/6,tx=200+125*Math.cos(m),ty=200+125*Math.sin(m);return `<path d="M200 200 L${x} ${y} A184 184 0 0 1 ${xx} ${yy} Z" fill="${fills[i]}" stroke="#faf8f0" stroke-width="2"/><text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-family="Georgia,serif" font-size="24" fill="${i===3?'#fff8e7':'#173e2c'}" transform="rotate(${i*60-60},${tx},${ty})">${l}</text>`}).join('')}</g><circle cx="200" cy="200" r="43" fill="#fffdf3" stroke="#173e2c" stroke-width="3"/><path d="M200 224c-31-10-24-35-24-35 25 0 31 20 24 35m1-13c-4-21 21-25 21-25 3 20-7 27-21 25" fill="#173e2c"/><circle cx="200" cy="200" r="189" fill="none" stroke="#f5e2a7" stroke-width="5"/></svg></div>`}
function renderHome(){return `<section class="hero"><div class="intro"><div class="eyebrow">BIENVENIDO AL CLUB GRANERO FINO</div><h1>Tu compra tiene<br>una <em>sorpresa.</em></h1><p>Un pequeño gracias por elegirnos.<br>Girá la ruleta, guardá tu premio y disfrutalo cuando vuelvas.</p><span class="tag"><span class="dot"></span> SIN DESCARGAR UNA APP</span></div><div class="wheel-card"><p class="wheel-caption">${ticketToken?'Tu giro está listo':'Algo bueno te espera'}</p>${wheel()}<button class="btn gold" data-action="${ticketToken?'spin':'instructions'}">${ticketToken?'Girar mi ruleta':'¿Cómo consigo mi giro?'} <span aria-hidden="true">↗</span></button><p class="wheel-note">${ticketToken?'Tu compra ya tiene un giro habilitado.':'Escaneá el QR que recibiste en caja.'}</p>${!ticketToken?'<button class="back" style="margin:16px 0 0;text-decoration:underline" data-action="demo">Ver una demostración</button>':''}</div></section>${steps()}<div id="message"></div>`}
function renderSpin(){return `<section class="hero"><div class="intro"><div class="eyebrow">${demo?'DEMOSTRACIÓN · SIN VALOR COMERCIAL':'GRACIAS POR TU COMPRA'}</div><h1>Un giro.<br>Una <em>sorpresa.</em></h1><p>Tu premio te espera para la próxima visita. Tocá el botón y descubrí qué te llevás.</p><span class="tag">${ticket?.test_mode||demo?'GIRO DE PRUEBA':'UN GIRO POR COMPRA'}</span><details class="notice"><summary>Premios y condiciones</summary><p style="font-size:14px;margin-top:12px">${(cfg?.prizes||[]).map(p=>esc(p.title)+' en compras desde '+money(p.min_purchase)).join('<br>')}<br>Vigencia: ${cfg?.validity_days||14} días desde el giro. Un cupón por comprobante de la próxima compra. El tamaño de cada sector no representa su probabilidad. Probabilidades proporcionales a los pesos publicados: ${(cfg?.prizes||[]).map(p=>money(p.amount)+': '+Math.round(p.weight/(cfg.prizes.reduce((a,p)=>a+p.weight,0)||1)*100)+'%').join(' · ')}. Pueden cambiar si se alcanza el presupuesto diario.</p></details></div><div class="wheel-card"><p class="wheel-caption">¡Hoy podés ganar!</p>${wheel()}<button class="btn gold" id="spin-btn" data-action="do-spin">Girar la ruleta ↻</button><p class="wheel-note">Sin costo adicional. Un giro único.</p><div id="form-message"></div></div></section>`}
function renderResult(){return `<section class="card center-card center"><span class="tag">${demo||ticket.test_mode?'PREMIO DE PRUEBA':'TU SORPRESA ESTÁ ACÁ'}</span><h2>¡Qué bueno verte ganar!</h2><div class="prize-banner"><div class="gift-icon" aria-hidden="true">✦</div><div class="value">${money(ticket.prize_amount)}</div><strong>de descuento</strong><small>En tu próxima compra desde ${money(ticket.prize_min)}<br>Válido hasta el ${date(ticket.prize_expires_at)}</small></div><p>Guardalo en el club para tenerlo a mano cuando vuelvas.</p><button class="btn full" data-action="register">Guardar mi premio →</button><p class="sub">Registro breve. Sin contraseña para el cliente.</p>${demo?'<p class="sub">Esto es una demostración. No genera un premio válido.</p>':''}</section>`}
function renderRegister(){return `<section class="card center-card"><button class="back" data-action="result">← Volver a mi premio</button><span class="tag">UN ÚLTIMO PASO</span><h2>Tu premio,<br>bien guardado.</h2><p>Decinos cómo te llamás y guardamos tu premio en este teléfono.</p><form id="register-form"><label class="field"><span>Tu nombre</span><input name="name" autocomplete="given-name" maxlength="60" required placeholder="¿Cómo te llamás?"></label><label class="field"><span>Tu celular</span><input name="phone" type="tel" autocomplete="tel" required value="+56 9 " placeholder="+56 9 1234 5678"></label><label class="check"><input name="terms" type="checkbox" required><span>Acepto las <a href="#" data-action="terms">condiciones y privacidad</a> del club.</span></label><label class="check"><input name="marketing" type="checkbox"><span>Quiero recibir novedades y beneficios de Granero Fino. Es opcional.</span></label><div id="form-message"></div><button class="btn full" type="submit">Guardar y entrar al club →</button><p class="sub">No enviamos un mensaje al registrarte. Tu número no permite acceder a tus premios: guardá tu enlace personal.</p></form></section>`}
function state(t){return t.revoked?'Anulado':t.redeemed_at?'Canjeado':new Date(t.prize_expires_at)<new Date()?'Vencido':'Disponible'}
function renderWallet(){if(!memberData)return '<div class="loading">Buscando tus premios…</div>';const {member,tickets}=memberData;if(!member)return `<section class="card center-card empty"><span class="gift-icon">✦</span><h2>Acá van tus próximas sorpresas.</h2><p>Cuando compres, pedí tu QR, girá la ruleta y guardá tu primer premio.</p><button class="btn" data-action="home">Volver al club</button><p class="sub" style="margin-top:20px">¿Ya tenías premios? Abrí el enlace personal que guardaste en tu otro teléfono.</p></section>`;
const list=tickets.filter(t=>filter==='all'||state(t)==='Disponible');return `<section class="page"><div class="page-head"><div><div class="eyebrow" style="margin-bottom:12px">TU RINCÓN EN EL CLUB</div><h2>Hola, ${esc(member.name)}.</h2><p>Estas son tus razones para volver.</p></div><span class="tag">SOCIO DEL CLUB</span></div><div class="club-grid"><div><div class="tabs"><button data-action="available" class="${filter==='available'?'active':''}">Disponibles (${tickets.filter(t=>state(t)==='Disponible').length})</button><button data-action="all" class="${filter==='all'?'active':''}">Todos mis premios</button></div><div class="prize-list">${list.length?list.map(t=>`<article class="coupon ${state(t)!=='Disponible'?'inactive':''}"><div class="coupon-main"><span class="status">${t.test_mode?'PRUEBA · ':''}${t.reward_source==='loyalty'?'TARJETA COMPLETA · ':''}${state(t)}</span><h3>${esc(prizeLabel(t))}</h3><p>En una nueva compra desde ${money(t.prize_min)}.</p><p>Válido hasta el ${date(t.prize_expires_at)}.</p></div><div class="coupon-bottom"><span class="sub">Un uso · No acumulable</span>${state(t)==='Disponible'?`<button class="btn small" data-action="show-prize" data-code="${esc(t.redeem_code)}">Mostrar en caja ↗</button>`:'<span class="status">'+state(t)+'</span>'}</div></article>`).join(''):'<div class="card empty"><h3>No tenés premios disponibles.</h3><p>Tu próxima compra puede traer otra sorpresa.</p></div>'}</div></div><aside><div class="side-card"><span style="font-size:34px">✦</span><h2>Lo bueno<br>es volver.</h2><p>En tu próxima compra válida, pedí un nuevo QR en caja. Otro giro, otra sorpresa.</p><a href="https://granerofino.cl/shop" target="_blank" rel="noopener" class="btn gold">Ver la tienda ↗</a></div><div class="notice"><strong>Guardá tu acceso personal</strong><p style="margin:10px 0">Tus premios están guardados en el club. Conservá tu enlace para abrirlos en otro teléfono. No lo compartas: da acceso a tus premios.</p><button class="btn light small full" data-action="save-link">Copiar mi acceso personal</button></div></aside></div></section>`}
function adminLogin(){return `<section class="card center-card"><span class="tag">SOLO EQUIPO GRANERO FINO</span><h2 style="margin-top:20px">${setupKey?'Activar la caja':'Hola, equipo.'}</h2><p>${setupKey?'Elegí la contraseña que van a usar para generar giros y canjear premios. Este enlace se usa una sola vez.':'Ingresá a caja para preparar la próxima sorpresa.'}</p><form id="login-form"><label class="field"><span>${setupKey?'Nueva contraseña · mínimo 12 caracteres':'Contraseña de caja'}</span><input name="password" type="password" autocomplete="${setupKey?'new-password':'current-password'}" minlength="${setupKey?12:1}" required></label>${setupKey?'<label class="field"><span>Repetí la contraseña</span><input name="confirm" type="password" autocomplete="new-password" required></label>':''}<div id="form-message"></div><button class="btn full">${setupKey?'Activar caja':'Entrar a caja'} →</button></form></section>`}
function renderAdmin(){if(!session)return adminLogin();if(!dash)return '<div class="loading">Abriendo caja…</div>';const c=dash.config,ts=dash.tickets.filter(t=>t.test_mode===c.test_mode);return `<section class="page"><div class="page-head"><div><div class="eyebrow" style="margin-bottom:10px">GRANERO FINO · CAJA</div><h2>Una compra. Una sorpresa.</h2><p>${c.test_mode?'Estás probando el circuito. No se emiten beneficios comerciales.':'Campaña activa. Los premios emitidos tienen valor comercial.'}</p></div><button class="btn light small" data-action="logout">Salir</button></div><div class="tabs">${[['create','Generar QR'],['redeem','Canjear premio'],['activity','Actividad'],['members','Miembros'],['settings','Configuración']].map(([k,l])=>`<button data-action="tab" data-tab="${k}" class="${adminTab===k?'active':''}">${l}</button>`).join('')}</div>${adminTab==='create'?`<div class="admin-grid"><div class="card"><h3>Preparar un nuevo giro</h3><p class="sub" style="margin:10px 0">Ingresá el comprobante para evitar giros duplicados.</p><form id="create-form"><label class="field"><span>Número de comprobante</span><input name="receipt" required maxlength="60" placeholder="Ej. B-1042" autocomplete="off"></label><label class="field"><span>Monto de la compra</span><input name="amount" type="number" inputmode="numeric" min="${c.min_purchase}" step="1" required placeholder="Ej. 12000"></label><p class="sub">Compra mínima para girar: ${money(c.min_purchase)}.</p><div id="form-message"></div><button class="btn full" style="margin-top:22px">Generar QR →</button></form></div><div class="card center" id="issued">${issued?renderIssued():'<div style="padding:60px 0"><span class="gift-icon">▦</span><h3 style="margin:15px 0">Acá aparecerá el QR</h3><p class="sub">El cliente lo escanea con la cámara<br>de su teléfono. Sin instalar nada.</p></div>'}</div></div>`:''}${adminTab==='redeem'?renderRedeem():''}${adminTab==='activity'?`<div class="stats"><div class="stat"><strong>${ts.length}</strong><span>QR en últimos 100 registros</span></div><div class="stat"><strong>${ts.filter(t=>t.spun_at).length}</strong><span>Giros realizados</span></div><div class="stat"><strong>${ts.filter(t=>t.redeemed_at).length}</strong><span>Premios canjeados</span></div></div><div class="card table-wrap"><table><thead><tr><th>Comprobante</th><th>Compra</th><th>Premio</th><th>Estado</th><th>Fecha</th><th></th></tr></thead><tbody>${ts.length?ts.map(t=>`<tr><td>${esc(t.receipt)}</td><td>${money(t.purchase_amount)}</td><td>${t.prize_title?esc(t.prize_title):'—'}</td><td>${t.revoked?'Anulado':t.redeemed_at?'Canjeado':t.spun_at?'Girado':'Sin girar'}</td><td>${date(t.created_at)}</td><td>${!t.spun_at&&!t.revoked?`<button class="btn light small" data-action="revoke" data-receipt="${esc(t.receipt)}" data-test="${t.test_mode}">Anular</button>`:''}</td></tr>`).join(''):'<tr><td colspan="6">Todavía no hay movimientos en este modo.</td></tr>'}</tbody></table></div>`:''}${adminTab==='members'?renderMembers():''}${adminTab==='settings'?renderSettings():''}<div id="message"></div></section>`}
function renderIssued(){const link=base()+'?giro='+issued.token;let img='';if(typeof qrcode==='function'){const qr=qrcode(0,'M');qr.addData(link);qr.make();img=qr.createImgTag(5,4,'Código QR de giro');}return `<span class="tag">${issued.test_mode?'QR DE PRUEBA':'GIRO LISTO'}</span><h3 style="margin-top:18px">¡Mostráselo al cliente!</h3><div class="qrbox">${img}</div><p class="sub">Escanear una sola vez. Disponible durante 7 días.</p><div class="actions" style="justify-content:center;margin-top:20px"><button class="btn small" data-action="copy-qr">Copiar enlace</button><a class="btn light small" href="https://wa.me/?text=${encodeURIComponent('Tu compra tiene una sorpresa en Granero Fino. Girá acá: '+link)}" target="_blank" rel="noopener">WhatsApp ↗</a><a class="btn light small" href="${esc(link)}" target="_blank" rel="noopener">Abrir giro ↗</a></div><p class="sub" style="margin-top:16px">El envío por WhatsApp lo hacés vos al elegir el contacto.</p>`}
function renderRedeem(){return `<div class="admin-grid"><div class="card"><h3>Buscar el premio del cliente</h3><form id="lookup-form"><label class="field"><span>Código del premio</span><input name="code" required placeholder="GF-…" autocomplete="off" style="text-transform:uppercase"></label><button class="btn full">Buscar premio</button></form><div id="form-message"></div></div><div class="card">${lookup?`<span class="tag">${lookup.test_mode?'PRUEBA · ':''}${state(lookup)}</span><h3 style="margin:18px 0">${esc(prizeLabel(lookup))}</h3><p class="sub">Socio: ${esc(lookup.name||'Todavía no registrado')}<br>Compra mínima: ${money(lookup.prize_min)}<br>Vence: ${date(lookup.prize_expires_at)}</p>${state(lookup)==='Disponible'&&lookup.name?`<form id="redeem-form"><label class="field"><span>Nuevo comprobante de compra</span><input name="receipt" required maxlength="60" autocomplete="off"></label><label class="field"><span>Monto antes del descuento</span><input name="amount" type="number" inputmode="numeric" min="${lookup.prize_min}" step="1" required></label><div class="notice">${lookup.test_mode?'Este es un canje de prueba. No apliques ningún descuento en Odoo.':lookup.prize_kind==='product'?'Entregá el producto indicado y registralo también en Odoo. Esta aplicación registra el canje.':'Se descontarán '+money(lookup.prize_amount)+'. Aplicá el descuento también en Odoo; esta aplicación registra el canje.'}</div><button class="btn full">Confirmar canje${lookup.prize_kind==='product'?'':' de '+money(lookup.prize_amount)}</button></form>`:'<div class="notice">Este premio no está disponible para canjear.</div>'}`:'<div class="empty"><span class="gift-icon">✦</span><p>El detalle aparecerá al buscar un código.</p></div>'}</div></div>`}
function renderSettings(){const c=dash.config;return `<div class="card" style="max-width:760px"><h3>Reglas del club</h3><form id="settings-form"><label class="check"><input type="checkbox" name="test_mode" ${c.test_mode?'checked':''}><span><strong>Modo de prueba</strong><br>Los QR de prueba nunca se convierten en premios reales, aunque actives la campaña después.</span></label><div class="settings-prize"><label class="field"><span>Compra mínima para girar</span><input type="number" name="min_purchase" min="1" required value="${c.min_purchase}"></label><label class="field"><span>Vigencia del premio · días</span><input type="number" name="validity_days" min="1" max="90" required value="${c.validity_days}"></label><label class="field"><span>Tope diario de premios · CLP</span><input type="number" name="daily_budget" min="1" required value="${c.daily_budget}"></label></div><p class="sub">El tope reserva el valor completo de cada descuento al girar. Cuando se agota, no se entregan más premios ese día. Un QR pendiente conserva su giro hasta vencer.</p><h3 style="margin:28px 0 14px">Premios de la ruleta</h3>${dash.prizes.map((p,i)=>`<div style="border-top:1px solid var(--line);padding:10px 0"><strong style="font-size:14px">Premio ${i+1}</strong><div class="settings-prize"><label class="field"><span>Descuento · CLP</span><input name="amount_${p.id}" type="number" min="1" required value="${p.amount}"></label><label class="field"><span>Mínimo próxima compra</span><input name="minimum_${p.id}" type="number" min="1" required value="${p.min_purchase}"></label><label class="field"><span>Peso de probabilidad</span><input name="weight_${p.id}" type="number" min="0" max="10000" required value="${p.weight}"></label></div></div>`).join('')}<div class="notice">Los pesos son proporcionales: 60 / 30 / 10 equivale a 60% / 30% / 10% mientras estén disponibles los tres premios. Cambiar estas reglas no modifica premios que ya se ganaron.</div><div id="form-message"></div><button class="btn">Guardar configuración</button></form></div>`}
function render(){ $('#test-banner').hidden=!(demo||cfg?.test_mode||ticket?.test_mode);$('#app').innerHTML=view==='home'?renderHome():view==='spin'?renderSpin():view==='result'?renderResult():view==='register'?renderRegister():view==='wallet'?renderWallet():renderAdmin(); }
async function openWallet(){memberData=null;setView('wallet');if(demo){memberData=JSON.parse(localStorage.getItem('gf-demo-v1')||'null')||{member:null,tickets:[]};render();return}try{memberData=await api('wallet',{wallet});render()}catch(e){$('#app').innerHTML='<div class="card center-card"><h2>No pudimos cargar tus premios.</h2><p class="error">'+esc(e.message)+'</p><button class="btn" data-action="wallet">Reintentar</button></div>'}}
async function openAdmin(){demo=false;setView('admin');if(session)await refreshAdmin()}
async function refreshAdmin(){try{dash=await api('dashboard',{session});cfg={...cfg,...dash.config};render()}catch(e){session=null;sessionStorage.removeItem('gf-admin-v1');dash=null;render();error(e)}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;let d=document.createElement('div');d.className='confetti';d.innerHTML=Array.from({length:35},(_,i)=>`<i style="left:${Math.random()*100}%;background:${['#efc76a','#597b4f','#b9c697'][i%3]};animation-delay:${Math.random()*.6}s"></i>`).join('');document.body.append(d);setTimeout(()=>d.remove(),3800)}
function modal(html){$('#overlay').innerHTML='<div class="modal-bg"><section class="modal" role="dialog" aria-modal="true" aria-label="Información del club">'+html+'<button class="btn light full" data-action="close-modal" style="margin-top:20px">Cerrar</button></section></div>';$('#overlay button')?.focus()}
function terms(){modal(`<h2>Un club simple y claro.</h2><div class="privacy-copy"><p>Participación sin costo adicional con una compra válida y un QR emitido por caja. Cada QR habilita un solo giro y vence a los 7 días. Los premios de prueba no tienen valor comercial.</p><p>Cada premio muestra su monto, mínimo de compra y vencimiento. Se usa una sola vez en una compra posterior presencial, con otro comprobante. Un cupón por comprobante. No es canjeable por dinero ni acumulable con otros cupones del club.</p><p>La selección es aleatoria y ponderada. Los sectores de la ruleta son ilustrativos. Las probabilidades se muestran antes de girar y pueden variar si se alcanza el presupuesto disponible. Los premios ya emitidos conservan sus condiciones.</p><p>Guardamos nombre, teléfono, aceptación de condiciones y premios para administrar el club. El permiso para recibir novedades es opcional. No compartas tu enlace personal: permite ver tus premios. Podés solicitar corrección o eliminación de tus datos en la tienda o al WhatsApp +56 9 3426 3907.</p><p>Granero Fino · Obispo Valdés 543, Galería Celeste, Local 7, Placilla. Condiciones v1. Los valores iniciales son de prueba hasta que la tienda active la campaña.</p></div>`)}
async function copy(s){try{await navigator.clipboard.writeText(s);toast('Enlace copiado')}catch{modal('<h3>Copiá este enlace</h3><div class="linkbox">'+esc(s)+'</div>')}}
document.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el)return;e.preventDefault();const a=el.dataset.action;
 if(a==='close-modal'){$('#overlay').innerHTML='';return}if(a==='terms'){terms();return}
 if(a==='home'){demo=false;setView('home')}if(a==='wallet')await openWallet();if(a==='admin')await openAdmin();
 if(a==='instructions')modal('<h2>Tu giro empieza en caja.</h2><p style="margin:20px 0">Después de tu compra válida, pedí tu QR. Abrí la cámara del teléfono, apuntá al código y tocá el enlace que aparece.</p><p class="sub">No necesitás instalar una aplicación. Si tenés dificultades, pedinos ayuda en la tienda.</p>');
 if(a==='demo'){demo=true;ticketToken=null;ticket={test_mode:true};setView('spin')}
 if(a==='spin')setView('spin');if(a==='result')setView('result');if(a==='register')setView('register');
 if(a==='do-spin'&&!busy){busy=true;el.disabled=true;el.textContent='Preparando tu sorpresa…';try{let result=demo?{prize_id:2,prize_amount:500,prize_min:10000,prize_title:'$500 de descuento',prize_expires_at:new Date(Date.now()+14*864e5).toISOString(),redeem_code:'DEMO-SIN-VALOR',test_mode:true,stamp_earned:cfg?.stamp_enabled,stamp_card:demoCard()}:await api('spin',{token:ticketToken,wallet});let ids=[1,2,1,3,1,2],possible=ids.map((v,i)=>v===result.prize_id?i:-1).filter(i=>i>=0),index=possible[0]??0;rot=1800+(360-((index*60)+30));$('#wheel').style.transform='rotate('+rot+'deg)';el.textContent='Girando…';await new Promise(r=>setTimeout(r,matchMedia('(prefers-reduced-motion: reduce)').matches?20:4100));ticket=result;setView('result');confetti()}catch(e){error(e);el.disabled=false;el.textContent='Volver a intentar'}finally{busy=false}}
 if(a==='available'||a==='all'){filter=a==='all'?'all':'available';render()}
 if(a==='save-link')await copy(base()+'#club='+wallet);
 if(a==='show-prize'){let t=memberData.tickets.find(t=>t.redeem_code===el.dataset.code);if(t)modal(`<span class="tag">${t.test_mode?'PREMIO DE PRUEBA':'MOSTRÁ ESTA PANTALLA EN CAJA'}</span><h2 style="margin-top:20px">${esc(prizeLabel(t))}</h2><div class="code">${esc(t.redeem_code)}</div><p>En una nueva compra desde ${money(t.prize_min)}.</p><p class="code-note">Vence el ${date(t.prize_expires_at)}. El equipo de caja confirma el canje. ${t.test_mode?'Sin valor comercial.':''}</p>`)}
 if(a==='copy-qr'&&issued)await copy(base()+'?giro='+issued.token);
 if(a==='tab'){adminTab=el.dataset.tab;render();if(adminTab==='members')await loadMembers()}
 if(a==='logout'){try{await api('logout',{session})}catch{}session=null;dash=null;sessionStorage.removeItem('gf-admin-v1');render()}
 if(a==='revoke')modal(`<h3>¿Anular el QR de ${esc(el.dataset.receipt)}?</h3><p style="margin:20px 0">El cliente ya no podrá girar con ese enlace.</p><button class="btn full" data-action="confirm-revoke" data-receipt="${esc(el.dataset.receipt)}" data-test="${el.dataset.test}">Sí, anular QR</button>`);
 if(a==='confirm-revoke'){try{await api('revoke',{session,receipt:el.dataset.receipt,test_mode:el.dataset.test==='true'});$('#overlay').innerHTML='';await refreshAdmin();toast('QR anulado')}catch(e){toast(e.message)}}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').innerHTML='';if(e.key==='Tab'&&$('#overlay .modal')){const f=[...$('#overlay .modal').querySelectorAll('button,a,input')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});
document.addEventListener('submit',async e=>{e.preventDefault();const form=e.target,fd=new FormData(form),b=form.querySelector('button[type=submit],button:not([type])');if(b)b.disabled=true;$('#form-message')&&($('#form-message').innerHTML='');try{
 if(form.id==='login-form'){const password=fd.get('password');if(setupKey){if(password!==fd.get('confirm'))throw Error('Las contraseñas no coinciden');await api('setup',{setup:setupKey,password});setupKey=null}const r=await api('login',{password});session=r.session;sessionStorage.setItem('gf-admin-v1',session);await refreshAdmin()}
 if(form.id==='create-form'){issued=await api('create',{session,receipt:fd.get('receipt'),amount:Number(fd.get('amount'))});await refreshAdmin();toast('QR generado')}
 if(form.id==='lookup-form'){lookup=await api('lookup',{session,code:fd.get('code')});render()}
